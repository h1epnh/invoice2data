issuer: Petrolimex
fields:
  symbol_no: 'Mẫu số\s+(\d+)'
  symbol_id: 'Ký hiệu:\s+(.*)'
  invoice_number: 'Số:\s+(\d+)'
  date: '\w+ \d{1,2} \w+ \d{1,2} \w+ \d{4}'
  date_sign: 'Ký ngày: \d{4}-\d{1,2}-\d{1,2}'

  ### GROUP SELLER ###
  seller_name: "Tên người bán.*"
  seller_phone: 'Điện thoại:\s+(.*)'
  tax_no: 'Mã số thuế:\s+(.*)'
  seller_tax_no:
    parser: lines
    start: 'Tên người bán:.*'
    end: 'Địa chỉ'
    line: 'Mã số thuế: (?P<tax_no>\d{10}-\d{3}|\d{10})'

  ### GROUP BUYER ###
  buyer_name: 'Tên người mua:.*'
  buyer_fullname: "Họ tên người mua.*"
  buyer_address: 'Địa chỉ:\s+(.*)'
  buyer_tax_no:
    parser: lines
    start: 'Họ tên người mua:'
    end: 'Địa chỉ'
    line: 'Mã số thuế: (?P<tax_no>\d+)'
  

