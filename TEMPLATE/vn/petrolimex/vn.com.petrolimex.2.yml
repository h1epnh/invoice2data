issuer: Petrolimex
fields:
  symbol_id: 'Ký hiệu:\s+(.*)'
  symbol_no: 'Số\s+(\d+)'
  invoice_number: 'Số:\s+(\d+)'
  seller_company_name: "Đơn vị bán hàng.*   "
  seller_address: "Địa chỉ.*   "
  store_no: "Cửa hàng số.*"
  seller_tax_no: 'Mã số thuế:\s+(.*)'
  # seller_address: 'Mã số thuế::\s+(\d+)'
  # seller_phone: 'Điện thoại:\s+(.*)'
  buyer_name: 'Người mua hàng:\s{30}'
  buyer_company_name: 'Đơn vị mua hàng:\s+(.*)   '
  buyer_address: "Địa chỉ.*   "
  license_plate: 'Biển số xe:\s+(.*)'
  buyer_tax_no: 'Mã số thuế:\s+(.*)'
  payment_method: 'Phương thức thanh toán:\s+(.*)'

  date: '\w+ \d{1,2} \w+ \d{1,2} \w+ \d{4}'

  lines:
    parser: lines
    start: 'STT'
    end: 'MST'
    # line: "(?P<item>  1.*$)"
    # line: (?P<id>1)\s+(?P<product_name>[A-Z].*)\s+(?P<unit>\w+)\s+(?P<qty>\d+)\s+(?P<price>\d+)\s+(?P<amount_untaxed>\d{1,3}(\.\d{3})*)
    line: (?P<id>1)\s+(?P<product_name>[A-Z].*)\s+(?P<unit>[A-Z].*)\s+(?P<qty>\b\d+(?:\,\d+)?\b)\s+(?P<price>\d{1,3}(?:\.\d{3})*(?:,\d{2}))\s+(?P<amount_untaxed>\d{1,3}(\.\d{3})*)
    # types:
    #   id: int
    #   nature: string
    #   qty: string
    #   price: float
    #   discount: float
    #   tax: float

keywords:
  - HÓA ĐƠN GIÁ TRỊ GIA TĂNG
  - Ký hiệu
  - Số
  # - XXX

options:
  currency: VND
  date_formats:
    # - "%d/%m/%Y"
    - "%Y-%m-%d"
  languages:
    - vi
  decimal_separator: "."
