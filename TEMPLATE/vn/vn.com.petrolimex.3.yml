issuer: Petrolimex
fields:
  symbol_no: 'Mẫu số\s+(\d+)'
  symbol_id: 'Ký hiệu:\s+(.*)'
  invoice_number: 'Số:\s+(\d+)'
  seller_name: "Tên người bán.*"
  seller_tax_no: 'Mã số thuế:\s+(.*)'
  # seller_address: 'Mã số thuế::\s+(\d+)'
  seller_phone: 'Điện thoại:\s+(.*)'
  buyer_name: 'Tên người mua:.*'
  buyer_fullname: "Họ tên người mua.*"

  date: '\w+ \d{1,2} \w+ \d{1,2} \w+ \d{4}'

  lines:
    parser: lines
    start: 'lượng\s+giá\s+'
    end: 'STT\s+Tên loại phí'
    # line: "(?P<item>  1.*$)"
    line: (?P<id>1)\s+(?P<nature>[A-Z].*)\s+(?P<service>[A-Z].*)\s+(?P<unit>\w+)\s+(?P<qty>\d+)\s+(?P<price>\d+)\s+(?P<discount>\d+)\s+(?P<tax>\d+%)\s+(?P<amount_untaxed>\d{1,3}(\.\d{3})*)
    # types:
    #   id: int
    #   nature: string
    #   qty: string
    #   price: float
    #   discount: float
    #   tax: float

keywords:
  - HOÁ ĐƠN GIÁ TRỊ GIA TĂNG
  - Mẫu số
  - Ký hiệu
  - Tên loại phí
  - Tiền phí

options:
  currency: VND
  date_formats:
    # - "%d/%m/%Y"
    - "%Y-%m-%d"
  languages:
    - vi
  decimal_separator: "."
